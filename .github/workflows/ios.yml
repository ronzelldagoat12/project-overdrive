
name: Project Overdrive iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Add iOS platform
        run: npx --yes --package=@capacitor/cli@7.4.3 cap add ios

      - name: Sync iOS
        run: npx cap sync ios
    
              - name: Install CocoaPods
        run: |
          cd ios/App
          pod install
          cd ../..
      - name: Build unsigned IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Project-Overdrive.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Project-Overdrive-IPA
          path: Project-Overdrive.ipa
      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: Project-Overdrive-iOS
          path: ios/
